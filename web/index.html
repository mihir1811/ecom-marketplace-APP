<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gemstone">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>gemstone</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Workaround for flutter/flutter#175074 / #179208 ("ViewInsets cannot be
    negative" / stale viewport after the mobile keyboard is dismissed).
    When the virtual keyboard closes, the browser may leave the window
    scrolled and the DOM input focused, so the engine computes a stale
    physicalSize and derives negative viewInsets. Resetting scroll and
    blurring the input forces a correct viewport recalculation. Only acts
    when the visual viewport height jumps by >100px (keyboard close).
  -->
  <script>
    if (window.visualViewport) {
      let lastViewportHeight = window.visualViewport.height;
      window.visualViewport.addEventListener('resize', function () {
        const currentHeight = window.visualViewport.height;
        if (currentHeight > lastViewportHeight + 100) {
          window.scrollTo(0, 0);
          const active = document.activeElement;
          if (active && active !== document.body && typeof active.blur === 'function') {
            active.blur();
          }
        }
        lastViewportHeight = currentHeight;
      });
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
