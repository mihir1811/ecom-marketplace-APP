org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin (AGP 9): plugins (flutter_webrtc, livekit_client) skip KGP when this is true.
android.builtInKotlin=true

# Allow legacy proguard-android.txt used by plugins (e.g. flutter_inappwebview_android) until they migrate for AGP 9+
android.r8.proguardAndroidTxt.disallowed=false

# Crashlytics Gradle plugin 3.0.x crashes at runtime under AGP 9 strict
# full-mode keep rules (firebase-android-sdk#7367); keep the AGP 8 behaviour.
android.r8.strictFullModeForKeepRules=false
