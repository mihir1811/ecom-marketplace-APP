name: gemworld
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  dio: ^5.5.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^4.0.6
  # The widget CachedNetworkImage renders; used directly by AppNetworkImage
  # to decode tiles/banners at their on-screen size (FitResizeImage).
  octo_image: ^2.1.3
  image_picker: ^1.2.3
  file_selector: ^1.1.0
  web: ^1.1.1
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  razorpay_flutter: ^1.4.5
  socket_io_client: ^3.1.6
  share_plus: ^13.3.0
  # Tax invoice as a PDF to share (jewellery orders).
  pdf: ^3.11.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_crashlytics: ^6.0.1
  flutter_animate: ^4.5.2
  speech_to_text: ^7.5.0
  livekit_client: ^2.13.2
  wakelock_plus: ^1.8.2
  video_player: ^2.14.1
  connectivity_plus: ^7.3.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  flutter_timezone: ^5.1.1
  visibility_detector: ^0.4.0+2

# Vendored copies (pub 1.6.3 / 2.13.2) with the conditional `apply plugin: 'kotlin-android'`
# removed: Flutter's KGP check greps for that line and warns even though it never runs.
# Drop these once upstream releases ship without it.
dependency_overrides:
  flutter_webrtc:
    path: third_party/flutter_webrtc
  livekit_client:
    path: third_party/livekit_client

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - public/images/
    - public/images/gemstones/
    - public/images/jewelryCategoryImages/
    - public/images/jewelryShowcase/
    - public/images/watch_logo/
    - assets/shapes/
    - assets/shapes/simulator/
    - assets/clarity/
    - assets/models/gems.bin
    - assets/policies/policies.json
    - assets/policies/policies_hi.json
    - assets/policies/policies_gu.json

  # Exact Google Fonts files the google_fonts package used to download at
  # runtime (sha256-verified). One family per variant, named like google_fonts
  # registers them, so text renders identically. See lib/core/theme/app_fonts.dart.
  fonts:
    - family: Outfit_100
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
    - family: Outfit_200
      fonts:
        - asset: assets/fonts/Outfit-ExtraLight.ttf
    - family: Outfit_300
      fonts:
        - asset: assets/fonts/Outfit-Light.ttf
    - family: Outfit_regular
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
    - family: Outfit_500
      fonts:
        - asset: assets/fonts/Outfit-Medium.ttf
    - family: Outfit_600
      fonts:
        - asset: assets/fonts/Outfit-SemiBold.ttf
    - family: Outfit_700
      fonts:
        - asset: assets/fonts/Outfit-Bold.ttf
    - family: Outfit_800
      fonts:
        - asset: assets/fonts/Outfit-ExtraBold.ttf
    - family: Outfit_900
      fonts:
        - asset: assets/fonts/Outfit-Black.ttf
    - family: PlusJakartaSans_200
      fonts:
        - asset: assets/fonts/PlusJakartaSans-ExtraLight.ttf
    - family: PlusJakartaSans_300
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
    - family: PlusJakartaSans_regular
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
    - family: PlusJakartaSans_500
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
    - family: PlusJakartaSans_600
      fonts:
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
    - family: PlusJakartaSans_700
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
    - family: PlusJakartaSans_800
      fonts:
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
    - family: CormorantGaramond_300
      fonts:
        - asset: assets/fonts/CormorantGaramond-Light.ttf
    - family: CormorantGaramond_regular
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
    - family: CormorantGaramond_500
      fonts:
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
    - family: CormorantGaramond_600
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
    - family: CormorantGaramond_700
      fonts:
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
    - family: JetBrainsMono_regular
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: InstrumentSerif_regular
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
    - family: InstrumentSerif_italic
      fonts:
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
    - family: Manrope_200
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
    - family: Manrope_300
      fonts:
        - asset: assets/fonts/Manrope-Light.ttf
    - family: Manrope_regular
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
    - family: Manrope_500
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
    - family: Manrope_600
      fonts:
        - asset: assets/fonts/Manrope-SemiBold.ttf
    - family: Manrope_700
      fonts:
        - asset: assets/fonts/Manrope-Bold.ttf
    - family: Manrope_800
      fonts:
        - asset: assets/fonts/Manrope-ExtraBold.ttf

  shaders:
    - shaders/home_cosmos.frag
    - shaders/live_aurora.frag

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
